<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои игры — Нексус</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="logo.svg" alt="Нексус">
      <h1>Нексус</h1>
    </div>
    <nav class="nav-menu">
      <a href="index.html" class="nav-item"><span class="icon">🏠</span><span>Главная</span></a>
      <a href="create.html" class="nav-item"><span class="icon">🛠️</span><span>Создать</span></a>
      <a href="mygames.html" class="nav-item active"><span class="icon">📦</span><span>Мои игры</span></a>
      <a href="avatar.html" class="nav-item"><span class="icon">👤</span><span>Аватар</span></a>
      <a href="friends.html" class="nav-item"><span class="icon">👥</span><span>Друзья</span></a>
      <a href="settings.html" class="nav-item"><span class="icon">⚙️</span><span>Настройки</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card" onclick="location.href='avatar.html'">
        <div class="user-avatar" id="userAvatarIcon">😎</div>
        <div class="user-info">
          <div style="font-weight:600;font-size:0.9rem" id="userName">Игрок</div>
          <div style="font-size:0.75rem;color:#888">Онлайн</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="font-size:1.2rem;font-weight:700">📦 Мои игры</div>
      <div class="topbar-actions">
        <button class="btn btn-create" onclick="location.href='create.html'">＋ Создать новую</button>
      </div>
    </div>

    <div class="content">
      <div class="section-title">Опубликованные тобой</div>
      <div class="games-row" id="myGamesList"></div>

      <div id="emptyState" style="display:none;text-align:center;padding:60px 20px">
        <div style="font-size:5rem;margin-bottom:16px">📭</div>
        <h2>Пока нет игр</h2>
        <p style="color:#888;margin:12px 0 24px">Создай свою первую игру и опубликуй её!</p>
        <button class="btn btn-create" onclick="location.href='create.html'">Создать игру</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadUser();
      renderMyGames();
    });

    function renderMyGames() {
      const list = getPublishedGames();
      const container = document.getElementById('myGamesList');
      const empty = document.getElementById('emptyState');

      if (list.length === 0) {
        container.style.display = 'none';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      container.style.display = 'grid';
      container.innerHTML = '';

      list.forEach(g => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <div class="game-thumb" style="background:${g.color}">
            ${g.emoji}
            <div class="players">👤 ${g.players}</div>
          </div>
          <div class="game-info">
            <h3>${g.name}</h3>
            <p>${g.desc}</p>
            <div class="game-meta">
              <span>⭐ ${g.rating}</span>
              <div style="display:flex;gap:6px">
                <button class="play-btn-sm" onclick="playUserGame(${JSON.stringify(g).replace(/"/g,'&quot;')})">Играть</button>
                <button class="play-btn-sm" style="background:#e74c3c" onclick="event.stopPropagation();removeGame('${g.id}')">Удалить</button>
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function removeGame(id) {
      if (confirm('Удалить эту игру из опубликованных?')) {
        deletePublished(id);
        renderMyGames();
      }
    }
  </script>
</body>
</html>
