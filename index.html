<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кибер-склад</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="logo.svg" type="image/svg+xml">
</head>
<body>
<div class="topbar">
  <a href="index.html" class="logo"><img src="logo.svg" alt=""><span>Кибер-склад</span></a>
  <div class="search"><span style="opacity:.5">🔍</span><input id="q" placeholder="Поиск игр..." oninput="doSearch()"></div>
  <div class="top-right" id="authArea"></div>
</div>

<div class="page">
  <div class="chips" id="chips">
    <div class="chip active" data-cat="all" onclick="setCat(this)">Все</div>
    <div class="chip" data-cat="action" onclick="setCat(this)">Паркур</div>
    <div class="chip" data-cat="sport" onclick="setCat(this)">Спорт</div>
    <div class="chip" data-cat="arcade" onclick="setCat(this)">Аркады</div>
    <div class="chip" data-cat="idle" onclick="setCat(this)">Симуляторы</div>
    <div class="chip" data-cat="puzzle" onclick="setCat(this)">Головоломки</div>
  </div>

  <div class="section">
    <div class="section-title">🔥 Рекомендуемые</div>
    <div class="grid" id="featured"></div>
  </div>

  <div class="section">
    <div class="section-title">🎮 Игры <span id="cnt"></span></div>
    <div class="grid" id="grid"></div>
    <button class="load-more" id="moreBtn" onclick="loadMore()">Показать ещё</button>
  </div>
</div>

<div class="modal-bg" id="authModal">
  <div class="modal">
    <h2 id="mTitle">Вход</h2>
    <p class="sub" id="mSub">Сохраняй прогресс и рекорды</p>
    <div class="err" id="authErr"></div>
    <div id="loginForm">
      <label>Логин</label><input id="loginName" maxlength="20">
      <label>Пароль</label><input id="loginPass" type="password" maxlength="30">
      <button class="btn btn-blue full" onclick="doLogin()">Войти</button>
      <div class="switch">Нет аккаунта? <a onclick="showReg()">Регистрация</a></div>
    </div>
    <div id="regForm" style="display:none">
      <label>Логин</label><input id="regName" maxlength="20">
      <label>Пароль</label><input id="regPass" type="password" maxlength="30">
      <label>Повтори</label><input id="regPass2" type="password" maxlength="30">
      <button class="btn btn-blue full" onclick="doReg()">Создать</button>
      <div class="switch">Есть аккаунт? <a onclick="showLogin()">Войти</a></div>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
const ENGINES={
  obby:'games/obby.html',obby2:'games/obby2.html',tycoon:'games/tycoon.html',
  racing:'games/racing.html',hangout:'games/hangout.html',pets:'games/pets.html',
  snake:'games/snake.html',flappy:'games/flappy.html',memory:'games/memory.html',
  breakout:'games/breakout.html',dodge:'games/dodge.html',g2048:'games/game2048.html',
  football:'games/football.html',hockey:'games/hockey.html',basket:'games/basket.html',
  tennis:'games/tennis.html'
};
const COL=['linear-gradient(135deg,#e74c3c,#c0392b)','linear-gradient(135deg,#e67e22,#d35400)',
'linear-gradient(135deg,#f1c40f,#f39c12)','linear-gradient(135deg,#2ecc71,#27ae60)',
'linear-gradient(135deg,#1abc9c,#16a085)','linear-gradient(135deg,#3498db,#2980b9)',
'linear-gradient(135deg,#9b59b6,#8e44ad)','linear-gradient(135deg,#e91e63,#c2185b)',
'linear-gradient(135deg,#00bcd4,#0097a7)','linear-gradient(135deg,#ff5722,#e64a19)',
'linear-gradient(135deg,#607d8b,#455a64)','linear-gradient(135deg,#795548,#5d4037)'];
const EM=['🏃','💰','🏎️','👫','🐶','🏗️','🐍','📦','🧠','🧱','⚡','🔢','⚽','🏒','🏀','🎾',
'🎯','🚀','👾','🐉','🦄','🐱','🦊','🐻','🦁','🐸','🐲','🦸','🧙','👻','🔥','❄️','🌈','💎',
'🛡️','⚔️','🏹','💣','🎲','🎸','🏆','🎮','🕹️','🏈','⚾','🏐','🏓','🎳','🥊','🚴','🏄','🧗'];

// Огромный каталог (генерируется)
const PRE=['Super','Mega','Ultra','Pro','Epic','Neon','Dark','Cyber','Pixel','Retro','Fire','Ice',
'Thunder','Shadow','Golden','Crystal','Ninja','Space','Ocean','Forest','Desert','Sky','Lava',
'Frost','Storm','Quantum','Hyper','Turbo','Elite','Master','Legend','Royal','Magic','Dragon',
'Phantom','Solar','Lunar','Cosmic','Atomic','Turbo','Blitz','Rapid','Swift','Brave','Mighty'];
const MID=['Obby','Parkour','Run','Rush','Race','Jump','Quest','Adventure','Tycoon','Clicker',
'Simulator','Arena','Battle','Wars','Legends','Heroes','World','Land','Zone','Cup','League',
'Snake','Flappy','Breakout','Memory','Dodge','Football','Hockey','Basket','Tennis','Pets'];
const CATMAP={Obby:'action',Parkour:'action',Run:'action',Rush:'action',Race:'action',Jump:'action',
Quest:'action',Adventure:'action',Tycoon:'idle',Clicker:'idle',Simulator:'idle',Arena:'sport',
Battle:'action',Wars:'action',Legends:'action',Heroes:'action',World:'social',Land:'social',
Zone:'social',Cup:'sport',League:'sport',Snake:'arcade',Flappy:'arcade',Breakout:'arcade',
Memory:'puzzle',Dodge:'action',Football:'sport',Hockey:'sport',Basket:'sport',Tennis:'sport',Pets:'idle'};
const ENGMAP={Obby:'obby',Parkour:'obby2',Run:'obby',Rush:'dodge',Race:'racing',Jump:'obby2',
Quest:'obby',Adventure:'obby2',Tycoon:'tycoon',Clicker:'tycoon',Simulator:'pets',Arena:'football',
Battle:'dodge',Wars:'dodge',Legends:'obby',Heroes:'obby2',World:'hangout',Land:'hangout',
Zone:'hangout',Cup:'football',League:'hockey',Snake:'snake',Flappy:'flappy',Breakout:'breakout',
Memory:'memory',Dodge:'dodge',Football:'football',Hockey:'hockey',Basket:'basket',Tennis:'tennis',Pets:'pets'};

const TOTAL=5000; // показываем как большой каталог
let allGames=[], shown=0, pageSize=48, currentCat='all', searchQ='';

function makeGames(){
  allGames=[];
  // Реальные базовые
  const real=[
    {n:'Obby Adventure',d:'100 уровней паркура!',e:'obby',c:'action',em:'🏃'},
    {n:'Sky Obby',d:'Небесный паркур с 100 уровнями',e:'obby2',c:'action',em:'🏗️'},
    {n:'Click Tycoon',d:'Кликай и строй империю',e:'tycoon',c:'idle',em:'💰'},
    {n:'Speed Race',d:'Гонки на выживание',e:'racing',c:'action',em:'🏎️'},
    {n:'Hangout Plaza',d:'Гуляй с друзьями',e:'hangout',c:'social',em:'👫'},
    {n:'Pet Simulator',d:'Собери всех питомцев',e:'pets',c:'idle',em:'🐶'},
    {n:'Змейка',d:'Классика',e:'snake',c:'arcade',em:'🐍'},
    {n:'Flappy Cube',d:'Летай между труб',e:'flappy',c:'arcade',em:'📦'},
    {n:'Мемори',d:'Найди пары',e:'memory',c:'puzzle',em:'🧠'},
    {n:'Арканоид',d:'Разбей блоки',e:'breakout',c:'arcade',em:'🧱'},
    {n:'Уворот',d:'Не дай себя задеть',e:'dodge',c:'action',em:'⚡'},
    {n:'2048',d:'Собери плитку',e:'g2048',c:'puzzle',em:'🔢'},
    {n:'Футбол',d:'Забивай голы',e:'football',c:'sport',em:'⚽'},
    {n:'Хоккей',d:'Забрось шайбу',e:'hockey',c:'sport',em:'🏒'},
    {n:'Баскетбол',d:'Бросай в кольцо',e:'basket',c:'sport',em:'🏀'},
    {n:'Теннис',d:'Отбивай мяч',e:'tennis',c:'sport',em:'🎾'},
  ];
  real.forEach((r,i)=>allGames.push({id:i,name:r.n,desc:r.d,emoji:r.em,color:COL[i%COL.length],players:800+Math.floor(Math.random()*3000),file:ENGINES[r.e],cat:r.c}));

  // Генерируем остальные
  for(let i=0;i<TOTAL-real.length;i++){
    const p=PRE[i%PRE.length], m=MID[i%MID.length];
    const name=p+' '+m+(i>MID.length*PRE.length?' '+((i%99)+1):'');
    const cat=CATMAP[m]||'action';
    const eng=ENGMAP[m]||'obby';
    allGames.push({
      id:real.length+i,
      name,
      desc: name+' — играй прямо сейчас!',
      emoji:EM[i%EM.length],
      color:COL[i%COL.length],
      players:50+Math.floor(Math.random()*4000),
      file:ENGINES[eng],
      cat
    });
  }
}

function cardHTML(g){
  return `<div class="card" onclick="location.href='${g.file}'">
    <div class="thumb" style="background:${g.color}">${g.emoji}
      <div class="online">👤 ${g.players.toLocaleString('ru')}</div>
    </div>
    <div class="info">
      <h3>${g.name}</h3>
      <p>${g.desc}</p>
      <button class="play" onclick="event.stopPropagation();location.href='${g.file}'">Играть</button>
    </div>
  </div>`;
}

function getFiltered(){
  let list=allGames;
  if(currentCat!=='all') list=list.filter(g=>g.cat===currentCat);
  if(searchQ) list=list.filter(g=>g.name.toLowerCase().includes(searchQ)||g.desc.toLowerCase().includes(searchQ));
  return list;
}

function render(){
  const list=getFiltered();
  document.getElementById('cnt').textContent='('+list.length.toLocaleString('ru')+')';
  document.getElementById('featured').innerHTML=list.slice(0,4).map(cardHTML).join('');
  document.getElementById('grid').innerHTML=list.slice(0,shown).map(cardHTML).join('');
  document.getElementById('moreBtn').style.display=shown>=list.length?'none':'block';
}

function loadMore(){shown+=pageSize;render()}
function setCat(el){
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  currentCat=el.dataset.cat;
  shown=pageSize;render();
}
function doSearch(){searchQ=document.getElementById('q').value.toLowerCase().trim();shown=pageSize;render()}

makeGames();
shown=pageSize;
render();
updateAuthUI();
</script>
</body>
</html>
