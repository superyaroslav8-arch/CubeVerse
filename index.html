<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кибер-склад — Игры</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo-link">
      <img src="logo.svg" alt="Кибер-склад">
      <span>Кибер-склад</span>
    </a>

    <div class="search-box">
      <span style="opacity:0.5">🔍</span>
      <input type="text" id="searchInput" placeholder="Поиск игр..." oninput="filterGames()">
    </div>
  </header>

  <div class="container">

    <!-- Рекомендуемые -->
    <section class="section">
      <div class="section-header">
        <h2>🔥 Рекомендуемые</h2>
        <span>лучшие игры прямо сейчас</span>
      </div>
      <div class="games-grid" id="featuredGames"></div>
    </section>

    <!-- Популярные -->
    <section class="section">
      <div class="section-header">
        <h2>⭐ Популярные</h2>
      </div>
      <div class="games-grid" id="popularGames"></div>
    </section>

    <!-- Все игры -->
    <section class="section">
      <div class="section-header">
        <h2>🎮 Все игры</h2>
      </div>
      <div class="games-grid" id="allGames"></div>
    </section>

  </div>

  <script>
    const GAMES = [
      {
        id: 'obby',
        name: 'Obby Adventure',
        desc: 'Пройди сложные препятствия и доберись до финиша!',
        emoji: '🏃',
        color: 'linear-gradient(135deg, #ff6b6b, #ee5a24)',
        players: 1247,
        rating: 4.8,
        file: 'games/obby.html'
      },
      {
        id: 'tycoon',
        name: 'Click Tycoon',
        desc: 'Зарабатывай монеты, покупай улучшения и стань самым богатым!',
        emoji: '💰',
        color: 'linear-gradient(135deg, #f9ca24, #f0932b)',
        players: 892,
        rating: 4.6,
        file: 'games/tycoon.html'
      },
      {
        id: 'racing',
        name: 'Speed Race',
        desc: 'Гонки на скорость. Обгони всех и приди первым!',
        emoji: '🏎️',
        color: 'linear-gradient(135deg, #4834d4, #686de0)',
        players: 654,
        rating: 4.5,
        file: 'games/racing.html'
      },
      {
        id: 'hangout',
        name: 'Hangout Plaza',
        desc: 'Гуляй, общайся и танцуй вместе с другими игроками!',
        emoji: '👫',
        color: 'linear-gradient(135deg, #6ab04c, #badc58)',
        players: 2103,
        rating: 4.9,
        file: 'games/hangout.html'
      },
      {
        id: 'pets',
        name: 'Pet Simulator',
        desc: 'Собирай питомцев, качай их и становись легендой!',
        emoji: '🐶',
        color: 'linear-gradient(135deg, #eb4d4b, #ff7979)',
        players: 1789,
        rating: 4.7,
        file: 'games/pets.html'
      },
      {
        id: 'obby2',
        name: 'Sky Obby',
        desc: 'Сложный паркур в небесах. Сможешь пройти до конца?',
        emoji: '🏗️',
        color: 'linear-gradient(135deg, #22a6b3, #7ed6df)',
        players: 543,
        rating: 4.4,
        file: 'games/obby2.html'
      },
      {
        id: 'parkour',
        name: 'Extreme Parkour',
        desc: 'Самый сложный паркур. Только для настоящих профи!',
        emoji: '🧗',
        color: 'linear-gradient(135deg, #e17055, #d63031)',
        players: 321,
        rating: 4.3,
        file: 'games/obby.html'
      },
      {
        id: 'farm',
        name: 'Ферма Кликер',
        desc: 'Выращивай урожай, продавай и расширяй свою ферму.',
        emoji: '🌾',
        color: 'linear-gradient(135deg, #00b894, #55efc4)',
        players: 876,
        rating: 4.5,
        file: 'games/tycoon.html'
      }
    ];

    function renderGames(containerId, games) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      games.forEach(g => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => location.href = g.file;

        card.innerHTML = `
          <div class="game-thumb" style="background:${g.color}">
            ${g.emoji}
            <div class="players">👤 ${g.players.toLocaleString('ru')}</div>
          </div>
          <div class="game-body">
            <h3>${g.name}</h3>
            <p>${g.desc}</p>
            <div class="game-footer">
              <div class="rating">⭐ ${g.rating}</div>
              <button class="play-btn" onclick="event.stopPropagation(); location.href='${g.file}'">Играть</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterGames() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      document.querySelectorAll('.game-card').forEach(card => {
        const name = card.querySelector('h3').textContent.toLowerCase();
        const desc = card.querySelector('p').textContent.toLowerCase();
        card.style.display = (name.includes(q) || desc.includes(q)) ? '' : 'none';
      });
    }

    // Рендер
    renderGames('featuredGames', GAMES.slice(0, 4));
    renderGames('popularGames', GAMES.slice(2, 6));
    renderGames('allGames', GAMES);
  </script>
</body>
</html>
