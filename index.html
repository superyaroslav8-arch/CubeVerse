    <div id="loginForm">

      <div class="switch">Нет аккаунта? <a onclick="showReg()">Регистрация</a></div>
    </div>
    <div id="regForm" style="display:none">

      <label>Пароль</label><input id="regPass" type="password" maxlength="30" placeholder="Пароль">

// Собираем полный список
let GAMES = [];
let idCounter = 1;

function addGame(name, desc, engine, cat, emoji) {
  const color = COLORS[GAMES.length % COLORS.length];
  const players = 200 + Math.floor(Math.random() * 2500);
  GAMES.push({
    id: 'g' + (idCounter++),
    name,
    desc,
    emoji: emoji || EMOJIS[GAMES.length % EMOJIS.length],
    color,
    players,
    file: ENGINES[engine] || ENGINES.obby,
    cat
  });
}

// Базовые
BASE.forEach(b => addGame(b.name, b.desc, b.engine, b.cat, b.emoji));

// Варианты
VARIANTS.forEach(v => addGame(v[0], v[1], v[2], v[3], v[4]));

// Добиваем до 110+ случайными тематическими
const prefixes = ['Super','Mega','Ultra','Pro','Epic','Legendary','Neon','Dark','Light','Cyber','Pixel','Retro','Future','Ancient','Magic','Fire','Ice','Thunder','Shadow','Golden'];
const suffixes = ['Adventure','Quest','Run','Rush','Challenge','Master','Hero','Legend','Battle','Arena','World','Land','Zone','Cup','League','Simulator','Clicker','Tycoon','Race','Jump'];
const enginesList = Object.keys(ENGINES);
const cats = ['action','arcade','idle','puzzle','sport','social'];

while (GAMES.length < 110) {
  const name = prefixes[Math.floor(Math.random()*prefixes.length)] + ' ' + suffixes[Math.floor(Math.random()*suffixes.length)];
  if (GAMES.some(g => g.name === name)) continue;
  const eng = enginesList[Math.floor(Math.random()*enginesList.length)];
  const cat = cats[Math.floor(Math.random()*cats.length)];
  addGame(name, 'Увлекательная игра в жанре ' + cat, eng, cat, EMOJIS[Math.floor(Math.random()*EMOJIS.length)]);
}

function render(id, list) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '';
  list.forEach(g => {
    const c = document.createElement('div');
    c.className = 'game-card';
    c.onclick = () => location.href = g.file;
    c.innerHTML = `<div class="game-thumb" style="background:${g.color}">${g.emoji}<div class="players">👤 ${g.players.toLocaleString('ru')}</div></div>
      <div class="game-body"><h3>${g.name}</h3><p>${g.desc}</p>
      <div class="game-footer"><button class="play-btn" onclick="event.stopPropagation();location.href='${g.file}'">Играть</button></div></div>`;
    el.appendChild(c);
  });
}

function filterGames() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  document.querySelectorAll('.game-card').forEach(c => {
    const n = c.querySelector('h3').textContent.toLowerCase();
    const d = c.querySelector('p').textContent.toLowerCase();
    c.style.display = (n.includes(q) || d.includes(q)) ? '' : 'none';
  });
}

// Рендер

render('action', GAMES.filter(g => g.cat === 'action').slice(0, 12));
render('arcade', GAMES.filter(g => g.cat === 'arcade' || g.cat === 'puzzle').slice(0, 12));
