<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кибер-склад — Игровая платформа</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="logo.svg" alt="Кибер-склад">
      <h1>Кибер-склад</h1>
    </div>
    <nav class="nav-menu">
      <a href="index.html" class="nav-item active"><span class="icon">🏠</span><span>Главная</span></a>
      <a href="create.html" class="nav-item"><span class="icon">🛠️</span><span>Создать</span></a>
      <a href="mygames.html" class="nav-item"><span class="icon">📦</span><span>Мои игры</span></a>
      <a href="avatar.html" class="nav-item"><span class="icon">👤</span><span>Аватар</span></a>
      <a href="friends.html" class="nav-item"><span class="icon">👥</span><span>Друзья</span></a>
      <a href="settings.html" class="nav-item"><span class="icon">⚙️</span><span>Настройки</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card" onclick="location.href='avatar.html'">
        <div class="user-avatar" id="userAvatarIcon">😎</div>
        <div class="user-info">
          <div style="font-weight:600;font-size:0.9rem" id="userName">Игрок</div>
          <div style="font-size:0.75rem;color:#888">Онлайн</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Поиск игр..." oninput="filterGames()">
      </div>
      <div class="topbar-actions">
        <button class="btn btn-create" onclick="location.href='create.html'">＋ Создать игру</button>
      </div>
    </div>

    <div class="content">
      <div class="section-title">🔥 Рекомендуемые <span>лучшие игры прямо сейчас</span></div>
      <div class="games-row" id="featuredGames"></div>

      <div class="section-title">⭐ Популярные</div>
      <div class="games-row" id="popularGames"></div>

      <div class="section-title">🆕 Новые и опубликованные</div>
      <div class="games-row" id="newGames"></div>

      <div id="myPublishedSection" style="display:none">
        <div class="section-title">📌 Мои опубликованные игры</div>
        <div class="games-row" id="myPublishedGames"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadUser();
      renderCatalog();
    });

    function renderCatalog() {
      const all = getAllGames();
      const featured = all.slice(0, 4);
      const popular = all.slice(2, 8);
      const newest = [...getPublishedGames(), ...all].slice(0, 8);

      renderGameCards('featuredGames', featured);
      renderGameCards('popularGames', popular);
      renderGameCards('newGames', newest);

      const myPub = getPublishedGames();
      if (myPub.length > 0) {
        document.getElementById('myPublishedSection').style.display = 'block';
        renderGameCards('myPublishedGames', myPub);
      }
    }

    function filterGames() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.game-card').forEach(card => {
        const name = card.querySelector('h3').textContent.toLowerCase();
        card.style.display = name.includes(q) ? '' : 'none';
      });
    }
  </script>
</body>
</html>
