<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Race — Кибер-склад</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: #0d0d12; }
    #raceCanvas { display: block; margin: 16px auto; background: #1a1a24; border-radius: 16px; max-width: 100%; }
    .hud { text-align: center; font-size: 1.15rem; color: #a0a0b0; padding: 8px; }
    .hint { text-align: center; color: #666; font-size: 0.9rem; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="game-header">
    <a href="../index.html" class="back-btn">← Назад</a>
    <div style="font-weight:700">🏎️ Speed Race</div>
    <div style="width:90px"></div>
  </div>

  <div class="hud">Скорость: <span id="speed">0</span> &nbsp;•&nbsp; Дистанция: <span id="dist">0</span> м</div>
  <canvas id="raceCanvas" width="800" height="400"></canvas>
  <p class="hint">Стрелки ← → или A D &nbsp;•&nbsp; Удерживай ↑ / W для ускорения</p>

  <script>
    const canvas = document.getElementById('raceCanvas');
    const ctx = canvas.getContext('2d');
    let car = { x: 350, y: 300, speed: 0 }, roadOffset = 0, distance = 0;
    let keys = {}, obstacles = [], gameOver = false;

    document.addEventListener('keydown', e => keys[e.code] = true);
    document.addEventListener('keyup', e => keys[e.code] = false);

    setInterval(() => {
      if (!gameOver) obstacles.push({ x: Math.random() * 580 + 100, y: -50, w: 40, h: 40 });
    }, 1100);

    function update() {
      if (gameOver) return;
      if (keys['ArrowLeft'] || keys['KeyA']) car.x -= 8;
      if (keys['ArrowRight'] || keys['KeyD']) car.x += 8;
      if (keys['ArrowUp'] || keys['KeyW']) car.speed = Math.min(car.speed + 0.3, 15);
      else car.speed = Math.max(car.speed - 0.15, 2);

      car.x = Math.max(80, Math.min(670, car.x));
      roadOffset += car.speed;
      distance += car.speed * 0.1;

      for (let o of obstacles) {
        o.y += car.speed * 0.8;
        if (o.y > 450) o.dead = true;
        if (car.x < o.x + o.w && car.x + 50 > o.x && car.y < o.y + o.h && car.y + 70 > o.y) {
          gameOver = true;
          setTimeout(() => {
            alert('💥 Авария! Дистанция: ' + Math.floor(distance) + ' м');
            location.reload();
          }, 80);
        }
      }
      obstacles = obstacles.filter(o => !o.dead);

      document.getElementById('speed').textContent = Math.floor(car.speed * 10);
      document.getElementById('dist').textContent = Math.floor(distance);
    }

    function draw() {
      ctx.fillStyle = '#222'; ctx.fillRect(0, 0, 800, 400);
      // road lines
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.setLineDash([30, 30]);
      ctx.beginPath(); ctx.moveTo(400, (roadOffset % 60) - 60); ctx.lineTo(400, 460); ctx.stroke();
      ctx.setLineDash([]);
      // barriers
      ctx.fillStyle = '#444'; ctx.fillRect(50, 0, 20, 400); ctx.fillRect(730, 0, 20, 400);
      // obstacles
      ctx.fillStyle = '#e74c3c';
      for (let o of obstacles) ctx.fillRect(o.x, o.y, o.w, o.h);
      // car
      ctx.fillStyle = '#3498db'; ctx.fillRect(car.x, car.y, 50, 70);
      ctx.fillStyle = '#2980b9'; ctx.fillRect(car.x + 5, car.y + 10, 40, 25);
      ctx.fillStyle = '#fff'; ctx.fillRect(car.x + 10, car.y + 50, 10, 15); ctx.fillRect(car.x + 30, car.y + 50, 10, 15);
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
