<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Race | CubeVerse</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    #raceCanvas { display: block; margin: 20px auto; background: #222; border-radius: 12px; }
    .hud { text-align: center; font-size: 1.4rem; margin: 10px; }
  </style>
</head>
<body>
  <div class="game-header">
    <a href="../index.html" class="back-btn">← Назад</a>
    <div class="game-title">Speed Race</div>
    <div></div>
  </div>

  <div class="hud">
    Скорость: <span id="speed">0</span> | Дистанция: <span id="dist">0</span>m
  </div>
  <canvas id="raceCanvas" width="800" height="400"></canvas>
  <p style="text-align:center; opacity:0.7;">Стрелки влево/вправо или A/D • Держи скорость!</p>

  <script>
    const canvas = document.getElementById('raceCanvas');
    const ctx = canvas.getContext('2d');
    let car = { x: 350, y: 300, speed: 0 };
    let roadOffset = 0;
    let distance = 0;
    let keys = {};
    let obstacles = [];
    let gameOver = false;

    document.addEventListener('keydown', e => keys[e.code] = true);
    document.addEventListener('keyup', e => keys[e.code] = false);

    function spawnObstacle() {
      obstacles.push({
        x: Math.random() * 600 + 100,
        y: -50,
        w: 40,
        h: 40
      });
    }

    setInterval(spawnObstacle, 1200);

    function update() {
      if (gameOver) return;

      if (keys['ArrowLeft'] || keys['KeyA']) car.x -= 8;
      if (keys['ArrowRight'] || keys['KeyD']) car.x += 8;
      if (keys['ArrowUp'] || keys['KeyW']) car.speed = Math.min(car.speed + 0.3, 15);
      else car.speed = Math.max(car.speed - 0.15, 2);

      car.x = Math.max(80, Math.min(680, car.x));
      roadOffset += car.speed;
      distance += car.speed * 0.1;

      for (let o of obstacles) {
        o.y += car.speed * 0.8;
        if (o.y > 450) o.dead = true;

        if (car.x < o.x + o.w && car.x + 50 > o.x &&
            car.y < o.y + o.h && car.y + 70 > o.y) {
          gameOver = true;
          setTimeout(() => {
            alert('💥 Авария! Дистанция: ' + Math.floor(distance) + 'm');
            location.reload();
          }, 100);
        }
      }
      obstacles = obstacles.filter(o => !o.dead);

      document.getElementById('speed').textContent = Math.floor(car.speed * 10);
      document.getElementById('dist').textContent = Math.floor(distance);
    }

    function draw() {
      // Road
      ctx.fillStyle = '#333';
      ctx.fillRect(0, 0, 800, 400);

      // Road lines
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.setLineDash([30, 30]);
      ctx.beginPath();
      ctx.moveTo(400, (roadOffset % 60) - 60);
      ctx.lineTo(400, 460);
      ctx.stroke();
      ctx.setLineDash([]);

      // Side barriers
      ctx.fillStyle = '#555';
      ctx.fillRect(50, 0, 20, 400);
      ctx.fillRect(730, 0, 20, 400);

      // Obstacles
      ctx.fillStyle = '#e74c3c';
      for (let o of obstacles) {
        ctx.fillRect(o.x, o.y, o.w, o.h);
      }

      // Car
      ctx.fillStyle = '#3498db';
      ctx.fillRect(car.x, car.y, 50, 70);
      ctx.fillStyle = '#2980b9';
      ctx.fillRect(car.x + 5, car.y + 10, 40, 25);
      ctx.fillStyle = '#fff';
      ctx.fillRect(car.x + 10, car.y + 50, 10, 15);
      ctx.fillRect(car.x + 30, car.y + 50, 10, 15);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
