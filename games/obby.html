<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obby Adventure — Кибер-склад</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { overflow: hidden; background: #0d0d12; }
    #gameCanvas { display: block; margin: 20px auto; background: #1a1a2e; border-radius: 16px; max-width: 100%; }
    .hud { text-align: center; padding: 10px; font-size: 1.15rem; color: #a0a0b0; }
    .win-screen { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    .win-screen.show { display: flex; }
    .win-screen h2 { font-size: 2.2rem; color: #00e676; margin: 12px 0 24px; }
  </style>
</head>
<body>
  <div class="game-header">
    <a href="../index.html" class="back-btn">← Назад</a>
    <div style="font-weight:700">🏃 Obby Adventure</div>
    <div style="width:90px"></div>
  </div>

  <div class="hud">Уровень: <span id="level">1</span> &nbsp;•&nbsp; Попытки: <span id="tries">0</span></div>
  <canvas id="gameCanvas" width="900" height="480"></canvas>

  <div class="win-screen" id="winScreen">
    <div style="font-size:4rem">🎉</div>
    <h2>Ты победил!</h2>
    <button class="play-btn" style="padding:14px 32px;font-size:1.1rem" onclick="restart()">Играть снова</button>
    <a href="../index.html" class="back-btn" style="margin-top:16px">В каталог</a>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let player = { x: 50, y: 380, w: 30, h: 40, vy: 0, onGround: false };
    let platforms = [], level = 1, tries = 0, keys = {}, finished = false;

    function generateLevel() {
      platforms = [
        {x:0,y:430,w:200,h:50}, {x:250,y:380,w:120,h:18},
        {x:420,y:330,w:100,h:18}, {x:560,y:280,w:100,h:18},
        {x:700,y:230,w:120,h:18}, {x:850,y:180,w:50,h:18}
      ];
      if (level > 1) {
        platforms.push({x:300,y:260,w:80,h:14}, {x:500,y:200,w:80,h:14});
      }
      player.x = 50; player.y = 380; player.vy = 0; finished = false;
      document.getElementById('winScreen').classList.remove('show');
      document.getElementById('level').textContent = level;
    }

    function restart() { level = 1; tries = 0; document.getElementById('tries').textContent = 0; generateLevel(); }
    generateLevel();

    document.addEventListener('keydown', e => keys[e.code] = true);
    document.addEventListener('keyup', e => keys[e.code] = false);

    function update() {
      if (finished) return;
      if (keys['ArrowLeft'] || keys['KeyA']) player.x -= 5;
      if (keys['ArrowRight'] || keys['KeyD']) player.x += 5;
      if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.onGround) {
        player.vy = -14; player.onGround = false;
      }
      player.vy += 0.7; player.y += player.vy;
      player.onGround = false;

      for (let p of platforms) {
        if (player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y < p.y + p.h && player.y + player.h > p.y) {
          if (player.vy > 0 && player.y + player.h - player.vy <= p.y + 5) {
            player.y = p.y - player.h; player.vy = 0; player.onGround = true;
          }
        }
      }

      if (player.y > 500) {
        tries++; document.getElementById('tries').textContent = tries;
        player.x = 50; player.y = 380; player.vy = 0;
      }
      if (player.x > 850 && player.y < 230) {
        finished = true; document.getElementById('winScreen').classList.add('show'); level++;
      }
      if (player.x < 0) player.x = 0;
      if (player.x > 870) player.x = 870;
    }

    function draw() {
      ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0, 0, 900, 480);
      ctx.fillStyle = '#00c853';
      for (let p of platforms) {
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeStyle = '#00e676'; ctx.lineWidth = 2; ctx.strokeRect(p.x, p.y, p.w, p.h);
      }
      // finish
      ctx.fillStyle = '#00ff88'; ctx.fillRect(860, 140, 10, 40);
      ctx.beginPath(); ctx.moveTo(870,140); ctx.lineTo(900,155); ctx.lineTo(870,170); ctx.fill();
      // player
      ctx.fillStyle = '#ff6b6b'; ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillStyle = '#fff'; ctx.fillRect(player.x+6, player.y+8, 8, 8); ctx.fillRect(player.x+16, player.y+8, 8, 8);
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
