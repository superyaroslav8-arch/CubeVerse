<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Obby Adventure — 100 уровней</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{overflow:hidden;background:#111216}
#c{display:block;margin:12px auto;background:#1a1a2e;border-radius:12px;max-width:100%}
.hud{text-align:center;padding:8px;font-size:1.1rem;color:#b0b0be}
.win{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);flex-direction:column;align-items:center;justify-content:center;z-index:50}
.win.show{display:flex}
.win h2{color:#00e676;font-size:1.8rem;margin:10px 0 18px}
</style>
</head>
<body>
<div class="gheader">
  <a href="../index.html" class="back">← Назад</a>
  <div style="font-weight:700">🏃 Obby Adventure</div>
  <div style="width:70px"></div>
</div>
<div class="hud">Уровень <span id="lv">1</span> / 100 &nbsp;•&nbsp; Попытки: <span id="tr">0</span></div>
<canvas id="c" width="900" height="480"></canvas>
<div class="win" id="win">
  <div style="font-size:3.5rem">🎉</div>
  <h2 id="wt">Уровень пройден!</h2>
  <button class="play" style="width:auto;padding:12px 28px;font-size:1rem" onclick="next()">Дальше</button>
  <a href="../index.html" class="back" style="margin-top:12px">В каталог</a>
</div>
<script src="../auth.js"></script>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let player={x:40,y:380,w:26,h:34,vy:0,on:false},plats=[],lv=1,tries=0,keys={},done=false;

// Процедурная генерация 100 уровней
function genLevel(n){
  const list=[{x:0,y:430,w:120,h:50}];
  let x=140,y=400;
  const count=6+Math.min(n,20); // больше платформ на высоких уровнях
  const gapBase=70+Math.min(n*1.5,50);
  const wBase=Math.max(70-n*0.4,28);
  for(let i=0;i<count;i++){
    const w=wBase+Math.random()*20-n*0.1;
    const gap=gapBase+Math.random()*30;
    x+=gap;
    y-=20+Math.random()*25+n*0.3;
    if(y<60)y=60+Math.random()*40;
    // иногда назад (сложность)
    if(n>15&&Math.random()<0.25) x-=gap*0.7;
    list.push({x,y,w:Math.max(22,w),h:12+Math.random()*4});
  }
  // финиш
  list.push({x:x+80,y:Math.max(50,y-30),w:50,h:14});
  return list;
}

function load(){
  // сохранение прогресса
  if(typeof getScore==='function'){
    const saved=getScore('obby_lv')||1;
    if(lv===1&&saved>1) lv=Math.min(saved,100);
  }
  plats=genLevel(lv);
  player={x:30,y:380,w:26,h:34,vy:0,on:false};
  done=false;
  document.getElementById('win').classList.remove('show');
  document.getElementById('lv').textContent=lv;
}
function next(){
  if(lv>=100){
    alert('🏆 Все 100 уровней пройдены! Ты легенда!');
    lv=1;tries=0;document.getElementById('tr').textContent=0;
  }else lv++;
  if(typeof setScore==='function')setScore('obby_lv',lv);
  load();
}
load();

document.addEventListener('keydown',e=>keys[e.code]=true);
document.addEventListener('keyup',e=>keys[e.code]=false);

function update(){
  if(done)return;
  if(keys['ArrowLeft']||keys['KeyA'])player.x-=5;
  if(keys['ArrowRight']||keys['KeyD'])player.x+=5;
  if((keys['Space']||keys['ArrowUp']||keys['KeyW'])&&player.on){player.vy=-13.2;player.on=false}
  player.vy+=0.62;player.y+=player.vy;player.on=false;
  for(const p of plats){
    if(player.x<p.x+p.w&&player.x+player.w>p.x&&player.y<p.y+p.h&&player.y+player.h>p.y){
      if(player.vy>0&&player.y+player.h-player.vy<=p.y+6){player.y=p.y-player.h;player.vy=0;player.on=true}
    }
  }
  if(player.y>520){tries++;document.getElementById('tr').textContent=tries;player.x=30;player.y=380;player.vy=0}
  const last=plats[plats.length-1];
  if(player.x>last.x&&player.y<last.y+40){
    done=true;
    document.getElementById('wt').textContent=lv>=100?'Все 100 уровней пройдены!':'Уровень '+lv+' пройден!';
    document.getElementById('win').classList.add('show');
  }
  if(player.x<0)player.x=0;if(player.x>874)player.x=874;
}
function draw(){
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,900,480);
  // platforms
  const hue=120+lv*2;
  ctx.fillStyle=`hsl(${hue},70%,45%)`;
  for(const p of plats){
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.strokeStyle=`hsl(${hue},80%,65%)`;ctx.lineWidth=2;ctx.strokeRect(p.x,p.y,p.w,p.h);
  }
  // flag
  const f=plats[plats.length-1];
  ctx.fillStyle='#00ff88';ctx.fillRect(f.x+f.w/2-3,f.y-36,7,36);
  ctx.beginPath();ctx.moveTo(f.x+f.w/2+4,f.y-36);ctx.lineTo(f.x+f.w/2+26,f.y-24);ctx.lineTo(f.x+f.w/2+4,f.y-12);ctx.fill();
  // player
  ctx.fillStyle='#ff6b6b';ctx.fillRect(player.x,player.y,player.w,player.h);
  ctx.fillStyle='#fff';ctx.fillRect(player.x+5,player.y+6,6,6);ctx.fillRect(player.x+15,player.y+6,6,6);
}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body></html>
