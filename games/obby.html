<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obby Adventure — Нексус</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { overflow: hidden; background: #121215; }
    .game-header { display:flex; justify-content:space-between; align-items:center; padding:12px 24px; background:#1a1a1f; border-bottom:1px solid #2a2a32; }
    .back-btn { background:#222228; border:none; color:white; padding:10px 18px; border-radius:8px; cursor:pointer; text-decoration:none; font-weight:600; }
    .back-btn:hover { background:#2a2a32; }
    #gameCanvas { display:block; margin:20px auto; background:#1a1a2e; border-radius:12px; }
    .hud { position:absolute; top:80px; left:30px; font-size:1.2rem; text-shadow:0 0 8px #000; }
    .win-screen { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); flex-direction:column; align-items:center; justify-content:center; z-index:100; }
    .win-screen.show { display:flex; }
  </style>
</head>
<body>
  <div class="game-header">
    <a href="../index.html" class="back-btn">← Нексус</a>
    <div style="font-weight:700;font-size:1.2rem">🏃 Obby Adventure</div>
    <div></div>
  </div>
  <div class="hud">Уровень: <span id="level">1</span> | Попытки: <span id="tries">0</span></div>
  <canvas id="gameCanvas" width="900" height="500"></canvas>
  <div class="win-screen" id="winScreen">
    <div style="font-size:4rem">🎉</div>
    <h2 style="font-size:2.5rem;color:#00ff9d;margin:16px 0">Ты победил!</h2>
    <button class="btn btn-primary" style="padding:14px 30px;font-size:1.1rem" onclick="restart()">Заново</button>
    <a href="../index.html" class="back-btn" style="margin-top:16px">В меню Нексуса</a>
  </div>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let player = { x:50, y:400, w:30, h:40, vy:0, onGround:false };
    let platforms = [], level=1, tries=0, keys={}, finished=false;

    function generateLevel() {
      platforms = [{x:0,y:450,w:200,h:50},{x:250,y:400,w:120,h:20},{x:420,y:350,w:100,h:20},{x:560,y:300,w:100,h:20},{x:700,y:250,w:120,h:20},{x:850,y:200,w:50,h:20}];
      if(level>1){platforms.push({x:300,y:280,w:80,h:15},{x:500,y:220,w:80,h:15});}
      player.x=50; player.y=400; player.vy=0; finished=false;
      document.getElementById('winScreen').classList.remove('show');
      document.getElementById('level').textContent=level;
    }
    function restart(){level=1;tries=0;document.getElementById('tries').textContent=0;generateLevel();}
    generateLevel();
    document.addEventListener('keydown',e=>keys[e.code]=true);
    document.addEventListener('keyup',e=>keys[e.code]=false);

    function update(){
      if(finished)return;
      if(keys['ArrowLeft']||keys['KeyA'])player.x-=5;
      if(keys['ArrowRight']||keys['KeyD'])player.x+=5;
      if((keys['ArrowUp']||keys['KeyW']||keys['Space'])&&player.onGround){player.vy=-14;player.onGround=false;}
      player.vy+=0.7; player.y+=player.vy;
      player.onGround=false;
      for(let p of platforms){
        if(player.x<p.x+p.w&&player.x+player.w>p.x&&player.y<p.y+p.h&&player.y+player.h>p.y){
          if(player.vy>0&&player.y+player.h-player.vy<=p.y+5){player.y=p.y-player.h;player.vy=0;player.onGround=true;}
        }
      }
      if(player.y>520){tries++;document.getElementById('tries').textContent=tries;player.x=50;player.y=400;player.vy=0;}
      if(player.x>850&&player.y<250){finished=true;document.getElementById('winScreen').classList.add('show');level++;}
      if(player.x<0)player.x=0; if(player.x>870)player.x=870;
    }
    function draw(){
      ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,900,500);
      ctx.fillStyle='#00b06f';
      for(let p of platforms){ctx.fillRect(p.x,p.y,p.w,p.h);ctx.strokeStyle='#00ff9d';ctx.lineWidth=2;ctx.strokeRect(p.x,p.y,p.w,p.h);}
      ctx.fillStyle='#00ff88';ctx.fillRect(860,160,10,40);
      ctx.beginPath();ctx.moveTo(870,160);ctx.lineTo(900,175);ctx.lineTo(870,190);ctx.fill();
      ctx.fillStyle='#ff6b6b';ctx.fillRect(player.x,player.y,player.w,player.h);
      ctx.fillStyle='#fff';ctx.fillRect(player.x+6,player.y+8,8,8);ctx.fillRect(player.x+16,player.y+8,8,8);
    }
    function loop(){update();draw();requestAnimationFrame(loop);} loop();
  </script>
</body>
</html>
