<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obby Adventure — Кибер-склад</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { overflow: hidden; background: #0d0d12; }
    #gameCanvas { display: block; margin: 16px auto; background: #1a1a2e; border-radius: 16px; max-width: 100%; }
    .hud { text-align: center; padding: 10px; font-size: 1.15rem; color: #a0a0b0; }
    .win-screen { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    .win-screen.show { display: flex; }
    .win-screen h2 { font-size: 2rem; color: #00e676; margin: 12px 0 20px; }
  </style>
</head>
<body>
  <div class="game-header">
    <a href="../index.html" class="back-btn">← Назад</a>
    <div style="font-weight:700">🏃 Obby Adventure</div>
    <div style="width:90px"></div>
  </div>
  <div class="hud">Уровень: <span id="level">1</span>/6 &nbsp;•&nbsp; Попытки: <span id="tries">0</span></div>
  <canvas id="gameCanvas" width="900" height="480"></canvas>
  <div class="win-screen" id="winScreen">
    <div style="font-size:4rem">🎉</div>
    <h2 id="winText">Уровень пройден!</h2>
    <button class="play-btn" style="padding:14px 32px;font-size:1.1rem" onclick="nextLevel()">Дальше</button>
    <a href="../index.html" class="back-btn" style="margin-top:14px">В каталог</a>
  </div>
  <script>
    const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
    let player = { x:50, y:380, w:28, h:36, vy:0, onGround:false };
    let platforms = [], level = 1, tries = 0, keys = {}, finished = false;

    const LEVELS = [
      // 1
      [{x:0,y:430,w:180,h:50},{x:230,y:380,w:100,h:16},{x:380,y:330,w:90,h:16},{x:520,y:280,w:90,h:16},{x:660,y:230,w:100,h:16},{x:820,y:180,w:80,h:16}],
      // 2
      [{x:0,y:430,w:120,h:50},{x:180,y:390,w:70,h:14},{x:300,y:340,w:60,h:14},{x:420,y:290,w:70,h:14},{x:550,y:240,w:60,h:14},{x:680,y:190,w:70,h:14},{x:820,y:140,w:80,h:16}],
      // 3
      [{x:0,y:430,w:100,h:50},{x:160,y:400,w:50,h:12},{x:260,y:360,w:50,h:12},{x:360,y:320,w:50,h:12},{x:460,y:280,w:50,h:12},{x:560,y:240,w:50,h:12},{x:660,y:200,w:50,h:12},{x:760,y:160,w:50,h:12},{x:850,y:120,w:50,h:14}],
      // 4
      [{x:0,y:430,w:140,h:50},{x:200,y:380,w:80,h:14},{x:100,y:320,w:70,h:14},{x:250,y:270,w:80,h:14},{x:150,y:210,w:70,h:14},{x:300,y:160,w:80,h:14},{x:450,y:160,w:60,h:14},{x:580,y:200,w:70,h:14},{x:720,y:160,w:80,h:14},{x:850,y:120,w:50,h:14}],
      // 5
      [{x:0,y:430,w:90,h:50},{x:150,y:400,w:40,h:12},{x:250,y:360,w:40,h:12},{x:150,y:310,w:40,h:12},{x:280,y:270,w:40,h:12},{x:180,y:220,w:40,h:12},{x:320,y:180,w:40,h:12},{x:450,y:180,w:50,h:12},{x:560,y:220,w:40,h:12},{x:670,y:180,w:40,h:12},{x:780,y:140,w:50,h:12},{x:870,y:100,w:30,h:12}],
      // 6 final
      [{x:0,y:430,w:80,h:50},{x:140,y:400,w:35,h:10},{x:230,y:360,w:35,h:10},{x:140,y:320,w:35,h:10},{x:250,y:280,w:35,h:10},{x:150,y:240,w:35,h:10},{x:270,y:200,w:35,h:10},{x:180,y:160,w:35,h:10},{x:320,y:130,w:40,h:10},{x:420,y:160,w:40,h:10},{x:530,y:130,w:40,h:10},{x:640,y:100,w:40,h:10},{x:750,y:130,w:40,h:10},{x:850,y:90,w:50,h:12}]
    ];

    function loadLevel() {
      platforms = LEVELS[Math.min(level-1, LEVELS.length-1)].map(p => ({...p}));
      player.x = 30; player.y = 380; player.vy = 0; finished = false;
      document.getElementById('winScreen').classList.remove('show');
      document.getElementById('level').textContent = level;
    }

    function nextLevel() {
      if (level >= LEVELS.length) {
        alert('🏆 Ты прошёл все 6 уровней!');
        level = 1; tries = 0;
        document.getElementById('tries').textContent = 0;
      } else {
        level++;
      }
      loadLevel();
    }

    loadLevel();
    document.addEventListener('keydown', e => keys[e.code] = true);
    document.addEventListener('keyup', e => keys[e.code] = false);

    function update() {
      if (finished) return;
      if (keys['ArrowLeft']||keys['KeyA']) player.x -= 5;
      if (keys['ArrowRight']||keys['KeyD']) player.x += 5;
      if ((keys['ArrowUp']||keys['KeyW']||keys['Space']) && player.onGround) { player.vy = -13.5; player.onGround = false; }
      player.vy += 0.65; player.y += player.vy;
      player.onGround = false;

      for (let p of platforms) {
        if (player.x < p.x+p.w && player.x+player.w > p.x && player.y < p.y+p.h && player.y+player.h > p.y) {
          if (player.vy > 0 && player.y + player.h - player.vy <= p.y + 6) {
            player.y = p.y - player.h; player.vy = 0; player.onGround = true;
          }
        }
      }

      if (player.y > 500) {
        tries++; document.getElementById('tries').textContent = tries;
        player.x = 30; player.y = 380; player.vy = 0;
      }

      const last = platforms[platforms.length-1];
      if (player.x > last.x && player.y < last.y + 30) {
        finished = true;
        document.getElementById('winText').textContent = level >= LEVELS.length ? 'Все уровни пройдены!' : 'Уровень пройден!';
        document.getElementById('winScreen').classList.add('show');
      }

      if (player.x < 0) player.x = 0;
      if (player.x > 872) player.x = 872;
    }

    function draw() {
      ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0,0,900,480);
      ctx.fillStyle = '#00c853';
      for (let p of platforms) {
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeStyle = '#00e676'; ctx.lineWidth = 2; ctx.strokeRect(p.x, p.y, p.w, p.h);
      }
      // flag
      const last = platforms[platforms.length-1];
      ctx.fillStyle = '#00ff88'; ctx.fillRect(last.x + last.w/2 - 2, last.y - 40, 8, 40);
      ctx.beginPath(); ctx.moveTo(last.x+last.w/2+6, last.y-40); ctx.lineTo(last.x+last.w/2+30, last.y-28); ctx.lineTo(last.x+last.w/2+6, last.y-16); ctx.fill();
      // player
      ctx.fillStyle = '#ff6b6b'; ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillStyle = '#fff'; ctx.fillRect(player.x+5, player.y+7, 7, 7); ctx.fillRect(player.x+16, player.y+7, 7, 7);
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
