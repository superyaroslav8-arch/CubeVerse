<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Simulator — Кибер-склад</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: #0d0d12; }
    .wrap { max-width: 600px; margin: 20px auto; text-align: center; padding: 0 16px; }
    .coins { font-size: 2.4rem; color: #f9ca24; margin: 16px 0; }
    .pet-display { font-size: 5.5rem; margin: 16px 0; min-height: 100px; }
    .pet-info { font-size: 1.2rem; margin-bottom: 20px; color: #a0a0b0; }
    .pet-info strong { color: white; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }
    .action-btn {
      padding: 14px 22px; border: none; border-radius: 12px; font-size: 1rem;
      font-weight: 700; cursor: pointer; background: linear-gradient(90deg, #eb4d4b, #ff7979); color: white;
    }
    .pets-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .pet-card {
      background: #1a1a24; padding: 14px; border-radius: 12px; min-width: 90px;
      cursor: pointer; border: 2px solid transparent; transition: border-color 0.2s;
    }
    .pet-card.active { border-color: #00c853; }
  </style>
</head>
<body>
  <div class="game-header">
    <a href="../index.html" class="back-btn">← Назад</a>
    <div style="font-weight:700">🐶 Pet Simulator</div>
    <div style="width:90px"></div>
  </div>

  <div class="wrap">
    <div class="coins">💰 <span id="coins">0</span></div>
    <div class="pet-display" id="petEmoji">🐶</div>
    <div class="pet-info">
      <strong id="petName">Щенок</strong><br>
      Сила: <span id="petPower">1</span> &nbsp;•&nbsp; Уровень: <span id="petLevel">1</span>
    </div>
    <div class="actions">
      <button class="action-btn" onclick="collect()">Собрать</button>
      <button class="action-btn" onclick="feed()">Покормить (10)</button>
      <button class="action-btn" onclick="buyPet()">Новый питомец (50)</button>
    </div>
    <div class="pets-list" id="petsList"></div>
  </div>

  <script>
    let coins = 0, current = 0;
    let pets = [{ emoji: '🐶', name: 'Щенок', power: 1, level: 1 }];
    const types = [
      {emoji:'🐶',name:'Щенок'},{emoji:'🐱',name:'Котик'},{emoji:'🐯',name:'Тигр'},
      {emoji:'🦊',name:'Лиса'},{emoji:'🐻',name:'Медведь'},{emoji:'🦁',name:'Лев'},
      {emoji:'🐧',name:'Пингвин'},{emoji:'🦄',name:'Единорог'}
    ];

    function ui() {
      const p = pets[current];
      document.getElementById('coins').textContent = Math.floor(coins);
      document.getElementById('petEmoji').textContent = p.emoji;
      document.getElementById('petName').textContent = p.name;
      document.getElementById('petPower').textContent = p.power;
      document.getElementById('petLevel').textContent = p.level;

      const list = document.getElementById('petsList');
      list.innerHTML = '';
      pets.forEach((pet, i) => {
        const card = document.createElement('div');
        card.className = 'pet-card' + (i === current ? ' active' : '');
        card.innerHTML = `${pet.emoji}<br>${pet.name}<br><small>Сила ${pet.power}</small>`;
        card.onclick = () => { current = i; ui(); };
        list.appendChild(card);
      });
    }

    function collect() { coins += pets[current].power; ui(); }
    function feed() {
      if (coins < 10) return;
      coins -= 10; pets[current].power += 1;
      if (pets[current].power % 5 === 0) pets[current].level++;
      ui();
    }
    function buyPet() {
      if (coins < 50) return;
      coins -= 50;
      const t = types[Math.floor(Math.random() * types.length)];
      pets.push({ ...t, power: 1 + Math.floor(Math.random() * 3), level: 1 });
      current = pets.length - 1;
      ui();
    }

    setInterval(() => {
      coins += pets.reduce((s, p) => s + p.power * 0.08, 0);
      ui();
    }, 1000);

    ui();
  </script>
</body>
</html>
