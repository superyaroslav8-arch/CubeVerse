<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 — Кибер-склад</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: #0d0d12; }
    .wrap { max-width: 400px; margin: 20px auto; padding: 0 12px; }
    .hud { text-align: center; font-size: 1.3rem; margin-bottom: 16px; color: #a0a0b0; }
    .grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      background: #1a1a24; padding: 8px; border-radius: 16px;
    }
    .cell {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; font-weight: 800; border-radius: 10px; background: #2a2a36;
      transition: background 0.15s;
    }
    .hint { text-align: center; color: #666; font-size: 0.9rem; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="game-header">
    <a href="../index.html" class="back-btn">← Назад</a>
    <div style="font-weight:700">🔢 2048</div>
    <div style="width:90px"></div>
  </div>
  <div class="wrap">
    <div class="hud">Счёт: <span id="score">0</span></div>
    <div class="grid" id="grid"></div>
    <p class="hint">Стрелки или WASD</p>
  </div>
  <script>
    const colors = {
      0:'#2a2a36',2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',
      32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',
      1024:'#edc53f',2048:'#edc22e'
    };
    let board = Array(16).fill(0), score = 0;

    function spawn() {
      const empty = board.map((v,i)=>v===0?i:null).filter(v=>v!==null);
      if (!empty.length) return;
      board[empty[Math.floor(Math.random()*empty.length)]] = Math.random()<0.9 ? 2 : 4;
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      board.forEach(v => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = v || '';
        cell.style.background = colors[v] || '#3c3a32';
        cell.style.color = v > 4 ? '#fff' : '#776e65';
        grid.appendChild(cell);
      });
      document.getElementById('score').textContent = score;
    }

    function slide(row) {
      let arr = row.filter(v => v);
      for (let i = 0; i < arr.length-1; i++) {
        if (arr[i] === arr[i+1]) { arr[i] *= 2; score += arr[i]; arr[i+1] = 0; }
      }
      arr = arr.filter(v => v);
      while (arr.length < 4) arr.push(0);
      return arr;
    }

    function move(dir) {
      const old = [...board];
      if (dir === 'left' || dir === 'right') {
        for (let r = 0; r < 4; r++) {
          let row = board.slice(r*4, r*4+4);
          if (dir === 'right') row.reverse();
          row = slide(row);
          if (dir === 'right') row.reverse();
          for (let c = 0; c < 4; c++) board[r*4+c] = row[c];
        }
      } else {
        for (let c = 0; c < 4; c++) {
          let col = [board[c], board[c+4], board[c+8], board[c+12]];
          if (dir === 'down') col.reverse();
          col = slide(col);
          if (dir === 'down') col.reverse();
          for (let r = 0; r < 4; r++) board[r*4+c] = col[r];
        }
      }
      if (board.some((v,i) => v !== old[i])) { spawn(); render(); }
      if (!board.includes(0) && !canMove()) setTimeout(() => alert('Игра окончена! Счёт: ' + score), 200);
    }

    function canMove() {
      for (let i = 0; i < 16; i++) {
        if (i%4<3 && board[i]===board[i+1]) return true;
        if (i<12 && board[i]===board[i+4]) return true;
      }
      return false;
    }

    document.addEventListener('keydown', e => {
      if (e.code==='ArrowLeft'||e.code==='KeyA') move('left');
      if (e.code==='ArrowRight'||e.code==='KeyD') move('right');
      if (e.code==='ArrowUp'||e.code==='KeyW') move('up');
      if (e.code==='ArrowDown'||e.code==='KeyS') move('down');
    });

    spawn(); spawn(); render();
  </script>
</body>
</html>
