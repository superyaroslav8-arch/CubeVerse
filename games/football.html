<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Футбол — Кибер-склад</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body{background:#0b0b10;overflow:hidden}
    #c{display:block;margin:12px auto;background:#2d8a4e;border-radius:16px;max-width:100%}
    .hud{text-align:center;padding:8px;font-size:1.2rem;color:#9a9aab}
    .hint{text-align:center;color:#555;font-size:.88rem}
  </style>
</head>
<body>
<div class="game-header">
  <a href="../index.html" class="back-btn">← Назад</a>
  <div style="font-weight:700">⚽ Футбол</div>
  <div style="width:80px"></div>
</div>
<div class="hud"><span id="score1">0</span> : <span id="score2">0</span> &nbsp;•&nbsp; До 5 голов</div>
<canvas id="c" width="700" height="400"></canvas>
<p class="hint">WASD / Стрелки — движение &nbsp;•&nbsp; Пробел — удар</p>
<script src="../auth.js"></script>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let p1={x:100,y:180,w:28,h:40},p2={x:570,y:180,w:28,h:40};
let ball={x:350,y:200,vx:0,vy:0,r:10};
let s1=0,s2=0,keys={},cooldown=0;

document.addEventListener('keydown',e=>keys[e.code]=true);
document.addEventListener('keyup',e=>keys[e.code]=false);

function resetBall(dir=0){
  ball={x:350,y:200,vx:dir*3,vy:(Math.random()-.5)*2,r:10};cooldown=40;
}

function loop(){
  // p1
  if(keys['KeyA']||keys['ArrowLeft'])p1.x-=5;
  if(keys['KeyD']||keys['ArrowRight'])p1.x+=5;
  if(keys['KeyW']||keys['ArrowUp'])p1.y-=5;
  if(keys['KeyS']||keys['ArrowDown'])p1.y+=5;
  p1.x=Math.max(10,Math.min(320,p1.x));p1.y=Math.max(10,Math.min(350,p1.y));

  // bot
  if(ball.x>350){
    if(p2.y+20<ball.y)p2.y+=3.2;else p2.y-=3.2;
    if(Math.abs(p2.x-ball.x)>40)p2.x+=ball.x>p2.x?2.5:-2.5;
  }else{p2.y+=(180-p2.y)*0.03;p2.x+=(570-p2.x)*0.03}
  p2.x=Math.max(360,Math.min(660,p2.x));p2.y=Math.max(10,Math.min(350,p2.y));

  if(cooldown>0)cooldown--;
  else{
    ball.x+=ball.vx;ball.y+=ball.vy;
    ball.vx*=0.995;ball.vy*=0.995;
    if(ball.y<ball.r||ball.y>400-ball.r)ball.vy*=-1;

    // kick
    if((keys['Space'])&&Math.hypot(ball.x-(p1.x+14),ball.y-(p1.y+20))<40){
      const a=Math.atan2(ball.y-(p1.y+20),ball.x-(p1.x+14));
      ball.vx=Math.cos(a)*8;ball.vy=Math.sin(a)*8;
    }
    // collisions
    [[p1,1],[p2,-1]].forEach(([p,d])=>{
      if(ball.x>p.x&&ball.x<p.x+p.w&&ball.y>p.y&&ball.y<p.y+p.h){
        ball.vx=d*Math.abs(ball.vx||4)+d*2;
        ball.vy+=(ball.y-(p.y+20))*0.15;
      }
    });

    // goals
    if(ball.x<0){s2++;document.getElementById('score2').textContent=s2;resetBall(1)}
    if(ball.x>700){s1++;document.getElementById('score1').textContent=s1;resetBall(-1)}
    if(s1>=5||s2>=5){
      const msg=s1>=5?'Победа! ⚽':'Поражение...';
      if(typeof setScore==='function')setScore('football',s1);
      setTimeout(()=>{alert(msg+' Счёт '+s1+':'+s2);location.reload()},150);return;
    }
  }

  // draw
  ctx.fillStyle='#2d8a4e';ctx.fillRect(0,0,700,400);
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(350,0);ctx.lineTo(350,400);ctx.stroke();
  ctx.beginPath();ctx.arc(350,200,50,0,Math.PI*2);ctx.stroke();
  // goals
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(0,120,12,160);ctx.fillRect(688,120,12,160);
  // players
  ctx.fillStyle='#fff';ctx.fillRect(p1.x,p1.y,p1.w,p1.h);
  ctx.fillStyle='#ff6b6b';ctx.fillRect(p2.x,p2.y,p2.w,p2.h);
  // ball
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  requestAnimationFrame(loop);
}
loop();
</script>
</body></html>
