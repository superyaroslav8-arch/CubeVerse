<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Гонки — Кибер-склад</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;overflow:hidden;background:#111}
#ui{position:absolute;top:60px;left:0;right:0;text-align:center;color:#fff;font-size:1.15rem;text-shadow:0 1px 4px #000;pointer-events:none}
</style>
</head>
<body>
<div class="gheader" style="position:relative;z-index:10">
  <a href="../index.html" class="back">← Назад</a>
  <div style="font-weight:700">🏎️ 3D Гонки</div>
  <div style="width:70px"></div>
</div>
<div id="ui">Очки: <span id="score">0</span> &nbsp;•&nbsp; Скорость: <span id="spd">0</span><br><small>A D / ← → — руль</small></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="../auth.js"></script>
<script>
let scene,camera,renderer,car,road=[],obstacles=[],clock=new THREE.Clock();
let speed=0,score=0,keys={},alive=true;

function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x222233);
  scene.fog=new THREE.Fog(0x222233,30,120);
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,200);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight-56);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x8888aa,0.6));
  const dl=new THREE.DirectionalLight(0xffffff,1);
  dl.position.set(5,20,10);scene.add(dl);

  // car
  car=new THREE.Mesh(
    new THREE.BoxGeometry(1.4,0.6,2.4),
    new THREE.MeshStandardMaterial({color:0x3498db})
  );
  car.position.set(0,0.4,0);
  scene.add(car);
  // cabin
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.5,1.2),new THREE.MeshStandardMaterial({color:0x2980b9}));
  cabin.position.y=0.5;cabin.position.z=-0.2;car.add(cabin);

  // road segments
  for(let i=0;i<30;i++)addRoad(i*-8);

  document.addEventListener('keydown',e=>keys[e.code]=true);
  document.addEventListener('keyup',e=>keys[e.code]=false);
  window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/(innerHeight-56);
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight-56);
  });
}

function addRoad(z){
  const seg=new THREE.Mesh(
    new THREE.BoxGeometry(12,0.2,8),
    new THREE.MeshStandardMaterial({color:0x333344})
  );
  seg.position.set(0,0,z);
  scene.add(seg);road.push(seg);
  // lines
  const line=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.21,3),new THREE.MeshBasicMaterial({color:0xffff00}));
  line.position.set(0,0.01,z);scene.add(line);road.push(line);
}

function spawnObstacle(){
  const o=new THREE.Mesh(
    new THREE.BoxGeometry(1.2+Math.random(),1,1.2+Math.random()),
    new THREE.MeshStandardMaterial({color:0xe74c3c})
  );
  o.position.set((Math.random()-0.5)*8,0.6,-60-Math.random()*20);
  scene.add(o);obstacles.push(o);
}

setInterval(()=>{if(alive)spawnObstacle()},900);

function update(dt){
  if(!alive)return;
  if(keys['KeyA']||keys['ArrowLeft'])car.position.x-=6*dt;
  if(keys['KeyD']||keys['ArrowRight'])car.position.x+=6*dt;
  car.position.x=Math.max(-5,Math.min(5,car.position.x));

  speed=Math.min(speed+dt*8,40+score*0.1);
  document.getElementById('spd').textContent=Math.floor(speed);
  score+=dt*speed*0.1;
  document.getElementById('score').textContent=Math.floor(score);

  // move road
  road.forEach(r=>{
    r.position.z+=speed*dt;
    if(r.position.z>20)r.position.z-=240;
  });
  // obstacles
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];
    o.position.z+=speed*dt;
    if(o.position.z>10){scene.remove(o);obstacles.splice(i,1);continue}
    if(Math.abs(o.position.x-car.position.x)<1.3&&Math.abs(o.position.z-car.position.z)<1.8){
      alive=false;
      if(typeof setScore==='function')setScore('race3d',Math.floor(score));
      setTimeout(()=>{alert('Авария! Очки: '+Math.floor(score));location.reload()},200);
    }
  }
  camera.position.set(car.position.x*0.5,5,car.position.z+10);
  camera.lookAt(car.position.x,0.5,car.position.z-5);
}

function animate(){
  requestAnimationFrame(animate);
  update(Math.min(clock.getDelta(),0.05));
  renderer.render(scene,camera);
}
init();animate();
</script>
</body></html>
