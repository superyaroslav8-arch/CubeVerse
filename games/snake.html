<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Змейка — Кибер-склад</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: #0d0d12; }
    #canvas { display: block; margin: 16px auto; background: #1a1a24; border-radius: 16px; }
    .hud { text-align: center; padding: 10px; font-size: 1.2rem; color: #a0a0b0; }
    .hint { text-align: center; color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="game-header">
    <a href="../index.html" class="back-btn">← Назад</a>
    <div style="font-weight:700">🐍 Змейка</div>
    <div style="width:90px"></div>
  </div>
  <div class="hud">Счёт: <span id="score">0</span> &nbsp;•&nbsp; Рекорд: <span id="record">0</span></div>
  <canvas id="canvas" width="400" height="400"></canvas>
  <p class="hint">Стрелки или WASD</p>
  <script>
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    const size = 20, cols = 20, rows = 20;
    let snake = [{x:10,y:10}], dir = {x:1,y:0}, food = {}, score = 0, alive = true;
    let record = +localStorage.getItem('ks_snake_record') || 0;
    document.getElementById('record').textContent = record;

    function placeFood() {
      food = { x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows) };
      if (snake.some(s => s.x === food.x && s.y === food.y)) placeFood();
    }
    placeFood();

    document.addEventListener('keydown', e => {
      if ((e.code==='ArrowUp'||e.code==='KeyW') && dir.y===0) dir={x:0,y:-1};
      if ((e.code==='ArrowDown'||e.code==='KeyS') && dir.y===0) dir={x:0,y:1};
      if ((e.code==='ArrowLeft'||e.code==='KeyA') && dir.x===0) dir={x:-1,y:0};
      if ((e.code==='ArrowRight'||e.code==='KeyD') && dir.x===0) dir={x:1,y:0};
    });

    function tick() {
      if (!alive) return;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x<0||head.x>=cols||head.y<0||head.y>=rows||snake.some(s=>s.x===head.x&&s.y===head.y)) {
        alive = false;
        if (score > record) { record = score; localStorage.setItem('ks_snake_record', record); }
        setTimeout(() => { alert('Игра окончена! Счёт: ' + score); location.reload(); }, 100);
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++; document.getElementById('score').textContent = score; placeFood();
      } else snake.pop();

      ctx.fillStyle = '#1a1a24'; ctx.fillRect(0,0,400,400);
      ctx.fillStyle = '#00c853';
      snake.forEach((s,i) => { ctx.fillRect(s.x*size+1, s.y*size+1, size-2, size-2); });
      ctx.fillStyle = '#ff6b6b'; ctx.fillRect(food.x*size+1, food.y*size+1, size-2, size-2);
    }
    setInterval(tick, 120);
  </script>
</body>
</html>
