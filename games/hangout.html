<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangout Plaza — Кибер-склад</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: #0d0d12; }
    #plaza {
      width: min(900px, 96vw); height: 420px; margin: 16px auto;
      background: linear-gradient(#87CEEB, #98D8AA); border-radius: 16px;
      position: relative; overflow: hidden;
    }
    .avatar { position: absolute; width: 40px; height: 50px; transition: left 0.08s, top 0.08s; }
    .avatar .head { width: 30px; height: 30px; background: #ffdbac; border-radius: 50%; margin: 0 auto; }
    .avatar .body { width: 36px; height: 25px; background: #3498db; border-radius: 8px; margin: 0 auto; }
    .chat-wrap { max-width: 900px; margin: 12px auto; padding: 0 12px; }
    .chat { display: flex; gap: 10px; }
    .chat input {
      flex: 1; padding: 12px 16px; border-radius: 12px; border: none;
      font-size: 1rem; background: #1a1a24; color: white; outline: none;
    }
    .chat button {
      padding: 12px 22px; background: #00c853; border: none; border-radius: 12px;
      font-weight: 700; cursor: pointer; color: #000;
    }
    .messages {
      margin-top: 10px; height: 90px; overflow-y: auto;
      background: #1a1a24; border-radius: 12px; padding: 12px; font-size: 0.95rem;
    }
    .hint { text-align: center; color: #666; font-size: 0.9rem; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="game-header">
    <a href="../index.html" class="back-btn">← Назад</a>
    <div style="font-weight:700">👫 Hangout Plaza</div>
    <div style="width:90px"></div>
  </div>

  <div id="plaza">
    <div class="avatar" id="player" style="left:430px;top:200px">
      <div class="head"></div><div class="body"></div>
    </div>
  </div>

  <div class="chat-wrap">
    <div class="chat">
      <input type="text" id="msgInput" placeholder="Напиши сообщение..." maxlength="80">
      <button onclick="sendMsg()">Отправить</button>
    </div>
    <div class="messages" id="messages"></div>
  </div>
  <p class="hint">Стрелки или WASD — движение</p>

  <script>
    const player = document.getElementById('player');
    let x = 430, y = 200, keys = {};

    document.addEventListener('keydown', e => keys[e.code] = true);
    document.addEventListener('keyup', e => keys[e.code] = false);

    function move() {
      if (keys['ArrowLeft'] || keys['KeyA']) x -= 4;
      if (keys['ArrowRight'] || keys['KeyD']) x += 4;
      if (keys['ArrowUp'] || keys['KeyW']) y -= 4;
      if (keys['ArrowDown'] || keys['KeyS']) y += 4;
      x = Math.max(10, Math.min(850, x));
      y = Math.max(10, Math.min(360, y));
      player.style.left = x + 'px';
      player.style.top = y + 'px';
      requestAnimationFrame(move);
    }
    move();

    // other players
    const colors = ['#e74c3c', '#2ecc71', '#9b59b6', '#f1c40f'];
    for (let i = 0; i < 4; i++) {
      const av = document.createElement('div');
      av.className = 'avatar';
      av.innerHTML = `<div class="head"></div><div class="body" style="background:${colors[i]}"></div>`;
      av.style.left = (80 + i * 180) + 'px';
      av.style.top = (120 + (i % 2) * 80) + 'px';
      document.getElementById('plaza').appendChild(av);

      setInterval(() => {
        const nx = parseInt(av.style.left) + (Math.random() - 0.5) * 50;
        const ny = parseInt(av.style.top) + (Math.random() - 0.5) * 40;
        av.style.left = Math.max(20, Math.min(820, nx)) + 'px';
        av.style.top = Math.max(20, Math.min(340, ny)) + 'px';
      }, 1800 + i * 400);
    }

    function sendMsg() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;
      const div = document.createElement('div');
      div.textContent = 'Ты: ' + text;
      document.getElementById('messages').appendChild(div);
      input.value = '';

      setTimeout(() => {
        const replies = ['Привет!', 'Как дела?', 'Круто!', 'Давай гулять!', 'Хаха', 'Огонь 🔥'];
        const r = document.createElement('div');
        r.style.opacity = '0.8';
        r.textContent = 'Игрок' + (Math.floor(Math.random()*4)+1) + ': ' + replies[Math.floor(Math.random()*replies.length)];
        document.getElementById('messages').appendChild(r);
      }, 700 + Math.random() * 1200);
    }

    document.getElementById('msgInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMsg();
    });
  </script>
</body>
</html>
