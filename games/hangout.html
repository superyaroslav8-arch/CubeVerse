<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangout Plaza — Нексус</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body{background:#121215}
    .game-header{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:#1a1a1f;border-bottom:1px solid #2a2a32}
    .back-btn{background:#222228;border:none;color:white;padding:10px 18px;border-radius:8px;cursor:pointer;text-decoration:none;font-weight:600}
    #plaza{width:900px;height:500px;margin:20px auto;background:linear-gradient(#87CEEB,#98D8AA);border-radius:16px;position:relative;overflow:hidden}
    .avatar{position:absolute;width:40px;height:50px;transition:left .1s,top .1s}
    .avatar .head{width:30px;height:30px;background:#ffdbac;border-radius:50%;margin:0 auto}
    .avatar .body{width:36px;height:25px;background:#3498db;border-radius:8px;margin:0 auto}
    .chat{max-width:900px;margin:10px auto;display:flex;gap:10px}
    .chat input{flex:1;padding:12px;border-radius:10px;border:none;font-size:1rem;background:#222;color:white}
    .chat button{padding:12px 25px;background:#00b06f;border:none;border-radius:10px;font-weight:bold;cursor:pointer;color:white}
    .messages{max-width:900px;margin:10px auto;height:100px;overflow-y:auto;background:rgba(0,0,0,.4);border-radius:10px;padding:10px}
  </style>
</head>
<body>
  <div class="game-header">
    <a href="../index.html" class="back-btn">← Нексус</a>
    <div style="font-weight:700;font-size:1.2rem">👫 Hangout Plaza</div>
    <div></div>
  </div>
  <div id="plaza">
    <div class="avatar" id="player" style="left:430px;top:220px"><div class="head"></div><div class="body"></div></div>
  </div>
  <div class="chat">
    <input type="text" id="msgInput" placeholder="Напиши сообщение..." maxlength="80">
    <button onclick="sendMsg()">Отправить</button>
  </div>
  <div class="messages" id="messages"></div>
  <p style="text-align:center;opacity:.7">Стрелки / WASD — движение • Пиши в чат!</p>
  <script>
    const player=document.getElementById('player');let x=430,y=220,keys={};
    document.addEventListener('keydown',e=>keys[e.code]=true);
    document.addEventListener('keyup',e=>keys[e.code]=false);
    function move(){
      if(keys['ArrowLeft']||keys['KeyA'])x-=4;if(keys['ArrowRight']||keys['KeyD'])x+=4;
      if(keys['ArrowUp']||keys['KeyW'])y-=4;if(keys['ArrowDown']||keys['KeyS'])y+=4;
      x=Math.max(10,Math.min(850,x));y=Math.max(10,Math.min(440,y));
      player.style.left=x+'px';player.style.top=y+'px';requestAnimationFrame(move);
    }move();
    const colors=['#e74c3c','#2ecc71','#9b59b6','#f1c40f'];
    for(let i=0;i<4;i++){
      const av=document.createElement('div');av.className='avatar';
      av.innerHTML=`<div class="head"></div><div class="body" style="background:${colors[i]}"></div>`;
      av.style.left=(100+i*180)+'px';av.style.top=(150+(i%2)*100)+'px';
      document.getElementById('plaza').appendChild(av);
      setInterval(()=>{const nx=parseInt(av.style.left)+(Math.random()-0.5)*40;const ny=parseInt(av.style.top)+(Math.random()-0.5)*30;
        av.style.left=Math.max(20,Math.min(840,nx))+'px';av.style.top=Math.max(20,Math.min(430,ny))+'px';},2000+i*500);
    }
    function sendMsg(){
      const input=document.getElementById('msgInput');const text=input.value.trim();if(!text)return;
      const div=document.createElement('div');div.textContent='Ты: '+text;document.getElementById('messages').appendChild(div);input.value='';
      setTimeout(()=>{const replies=['Привет!','Как дела?','Круто!','Давай гулять!','Хаха'];
        const r=document.createElement('div');r.textContent='Игрок'+Math.floor(Math.random()*4+1)+': '+replies[Math.floor(Math.random()*replies.length)];
        r.style.opacity='0.8';document.getElementById('messages').appendChild(r);},800+Math.random()*1500);
    }
    document.getElementById('msgInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendMsg();});
  </script>
</body>
</html>
