<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sky Obby — 100 разных уровней</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{overflow:hidden;background:#111216}
#c{display:block;margin:12px auto;border-radius:12px;max-width:100%}
.hud{text-align:center;padding:8px;font-size:1.1rem;color:#b0b0be}
.win{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);flex-direction:column;align-items:center;justify-content:center;z-index:50}
.win.show{display:flex}
.win h2{color:#00e676;font-size:1.7rem;margin:10px 0 16px}
</style>
</head>
<body>
<div class="gheader">
  <a href="../index.html" class="back">← Назад</a>
  <div style="font-weight:700">🏗️ Sky Obby</div>
  <div style="width:70px"></div>
</div>
<div class="hud">
  <div id="theme" style="font-size:.9rem;opacity:.85;margin-bottom:3px">Тема: Небо</div>
  Уровень <span id="lv">1</span> / 100 &nbsp;•&nbsp; Попытки: <span id="tr">0</span>
</div>
<canvas id="c" width="900" height="480"></canvas>
<div class="win" id="win">
  <div style="font-size:3.2rem">🎉</div>
  <h2 id="wt">Уровень пройден!</h2>
  <button class="play" style="width:auto;padding:12px 28px;font-size:1rem" onclick="next()">Дальше</button>
  <a href="../index.html" class="back" style="margin-top:12px">В каталог</a>
</div>
<script src="../auth.js"></script>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let player={x:40,y:380,w:24,h:32,vy:0,on:false},plats=[],lv=1,tries=0,keys={},done=false;
let sky1='#1e3c72',sky2='#2a5298',platC='#a0e7e5';

const THEMES=[
  {n:'Небо',s1:'#1e3c72',s2:'#2a5298',p:'#a0e7e5'},
  {n:'Закат',s1:'#4a1942',s2:'#c44536',p:'#f8b500'},
  {n:'Ночь',s1:'#0f0c29',s2:'#302b63',p:'#a29bfe'},
  {n:'Рассвет',s1:'#ffecd2',s2:'#fcb69f',p:'#e17055'},
  {n:'Шторм',s1:'#2c3e50',s2:'#4ca1af',p:'#ecf0f1'},
  {n:'Космос',s1:'#000000',s2:'#1a0033',p:'#e056fd'},
  {n:'Лето',s1:'#56ccf2',s2:'#2f80ed',p:'#6fcf97'},
  {n:'Осень',s1:'#f2994a',s2:'#f2c94c',p:'#eb5757'},
  {n:'Зима',s1:'#e0eafc',s2:'#cfdef3',p:'#ffffff'},
  {n:'Неон',s1:'#0f0c29',s2:'#24243e',p:'#00f2fe'}
];

function genLevel(n){
  const t=THEMES[Math.floor((n-1)/10)%THEMES.length];
  sky1=t.s1;sky2=t.s2;platC=t.p;
  document.getElementById('theme').textContent='Тема: '+t.n;

  const list=[{x:0,y:430,w:100,h:50}];
  let x=130,y=400;
  const count=7+Math.min(Math.floor(n/2.5),22);
  const style=n%4;

  for(let i=0;i<count;i++){
    let w,gap,dy;
    if(style===0){w=Math.max(22,60-n*0.3);gap=70+n*0.7;dy=-(20+n*0.35)}
    else if(style===1){w=Math.max(20,45-n*0.2);gap=95+n;dy=-(12+Math.random()*25)}
    else if(style===2){w=Math.max(18,50-n*0.25);gap=60+n*0.5;dy=(i%2?-28:12)-n*0.2}
    else{w=Math.max(20,55-n*0.2+Math.random()*18);gap=55+Math.random()*40+n*0.4;dy=-(15+Math.random()*20)}
    x+=gap;y+=dy;
    if(y<45)y=45+Math.random()*50;
    if(y>410)y=340;
    if(n>18&&Math.random()<0.25)x-=gap*0.45;
    list.push({x,y,w,h:11});
  }
  list.push({x:x+70,y:Math.max(40,y-25),w:48,h:13,finish:true});
  return list;
}

function load(){
  if(typeof getScore==='function'){const s=getScore('sky_lv')||1;if(lv===1&&s>1)lv=Math.min(s,100)}
  plats=genLevel(lv);
  player={x:30,y:380,w:24,h:32,vy:0,on:false};
  done=false;document.getElementById('win').classList.remove('show');
  document.getElementById('lv').textContent=lv;
}
function next(){
  if(lv>=100){alert('🏆 Все 100 уровней Sky Obby пройдены!');lv=1;tries=0;document.getElementById('tr').textContent=0}
  else lv++;
  if(typeof setScore==='function')setScore('sky_lv',lv);
  load();
}
load();

document.addEventListener('keydown',e=>keys[e.code]=true);
document.addEventListener('keyup',e=>keys[e.code]=false);

function update(){
  if(done)return;
  if(keys['ArrowLeft']||keys['KeyA'])player.x-=5;
  if(keys['ArrowRight']||keys['KeyD'])player.x+=5;
  if((keys['Space']||keys['ArrowUp']||keys['KeyW'])&&player.on){player.vy=-12.8;player.on=false}
  player.vy+=0.58;player.y+=player.vy;player.on=false;
  for(const p of plats){
    if(player.x<p.x+p.w&&player.x+player.w>p.x&&player.y<p.y+p.h&&player.y+player.h>p.y){
      if(player.vy>0&&player.y+player.h-player.vy<=p.y+5){
        player.y=p.y-player.h;player.vy=0;player.on=true;
        if(p.finish){done=true;document.getElementById('wt').textContent=lv>=100?'Все 100 уровней!':'Уровень '+lv+' пройден!';document.getElementById('win').classList.add('show')}
      }
    }
  }
  if(player.y>520){tries++;document.getElementById('tr').textContent=tries;player.x=30;player.y=380;player.vy=0}
  if(player.x<0)player.x=0;if(player.x>876)player.x=876;
}
function draw(){
  const g=ctx.createLinearGradient(0,0,0,480);g.addColorStop(0,sky1);g.addColorStop(1,sky2);
  ctx.fillStyle=g;ctx.fillRect(0,0,900,480);
  ctx.fillStyle='rgba(255,255,255,.2)';
  ctx.beginPath();ctx.arc(100,70,35,0,Math.PI*2);ctx.arc(140,70,45,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(650,90,40,0,Math.PI*2);ctx.arc(700,90,50,0,Math.PI*2);ctx.fill();
  for(const p of plats){
    ctx.fillStyle=p.finish?'#00ff88':platC;
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.strokeRect(p.x,p.y,p.w,p.h);
  }
  const f=plats[plats.length-1];
  ctx.fillStyle='#ff0';ctx.fillRect(f.x+f.w/2-3,f.y-34,7,34);
  ctx.beginPath();ctx.moveTo(f.x+f.w/2+4,f.y-34);ctx.lineTo(f.x+f.w/2+24,f.y-22);ctx.lineTo(f.x+f.w/2+4,f.y-10);ctx.fill();
  ctx.fillStyle='#ff6b6b';ctx.fillRect(player.x,player.y,player.w,player.h);
  ctx.fillStyle='#fff';ctx.fillRect(player.x+4,player.y+5,6,6);ctx.fillRect(player.x+14,player.y+5,6,6);
}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body></html>
