<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sky Obby — 100 уровней</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{overflow:hidden;background:#111216}
#c{display:block;margin:12px auto;background:linear-gradient(#1e3c72,#2a5298);border-radius:12px;max-width:100%}
.hud{text-align:center;padding:8px;font-size:1.1rem;color:#b0b0be}
.win{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);flex-direction:column;align-items:center;justify-content:center;z-index:50}
.win.show{display:flex}
.win h2{color:#00e676;font-size:1.8rem;margin:10px 0 18px}
</style>
</head>
<body>
<div class="gheader">
  <a href="../index.html" class="back">← Назад</a>
  <div style="font-weight:700">🏗️ Sky Obby</div>
  <div style="width:70px"></div>
</div>
<div class="hud">Уровень <span id="lv">1</span> / 100 &nbsp;•&nbsp; Попытки: <span id="tr">0</span></div>
<canvas id="c" width="900" height="480"></canvas>
<div class="win" id="win">
  <div style="font-size:3.5rem">🎉</div>
  <h2 id="wt">Уровень пройден!</h2>
  <button class="play" style="width:auto;padding:12px 28px;font-size:1rem" onclick="next()">Дальше</button>
  <a href="../index.html" class="back" style="margin-top:12px">В каталог</a>
</div>
<script src="../auth.js"></script>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let player={x:40,y:380,w:24,h:32,vy:0,on:false},plats=[],lv=1,tries=0,keys={},done=false;

function genLevel(n){
  const list=[{x:0,y:430,w:100,h:50}];
  let x=130,y=400;
  const count=7+Math.min(n,25);
  for(let i=0;i<count;i++){
    const w=Math.max(24,65-n*0.35+Math.random()*15);
    x+=55+Math.min(n,40)+Math.random()*25;
    y-=18+Math.random()*22+n*0.25;
    if(y<50)y=50+Math.random()*50;
    if(n>20&&Math.random()<0.3)x-=40;
    list.push({x,y,w,h:11});
  }
  list.push({x:x+70,y:Math.max(40,y-25),w:45,h:13});
  return list;
}

function load(){
  if(typeof getScore==='function'){
    const s=getScore('sky_lv')||1;
    if(lv===1&&s>1)lv=Math.min(s,100);
  }
  plats=genLevel(lv);
  player={x:30,y:380,w:24,h:32,vy:0,on:false};
  done=false;
  document.getElementById('win').classList.remove('show');
  document.getElementById('lv').textContent=lv;
}
function next(){
  if(lv>=100){alert('🏆 Все 100 уровней Sky Obby пройдены!');lv=1;tries=0;document.getElementById('tr').textContent=0}
  else lv++;
  if(typeof setScore==='function')setScore('sky_lv',lv);
  load();
}
load();

document.addEventListener('keydown',e=>keys[e.code]=true);
document.addEventListener('keyup',e=>keys[e.code]=false);

function update(){
  if(done)return;
  if(keys['ArrowLeft']||keys['KeyA'])player.x-=5;
  if(keys['ArrowRight']||keys['KeyD'])player.x+=5;
  if((keys['Space']||keys['ArrowUp']||keys['KeyW'])&&player.on){player.vy=-12.8;player.on=false}
  player.vy+=0.58;player.y+=player.vy;player.on=false;
  for(const p of plats){
    if(player.x<p.x+p.w&&player.x+player.w>p.x&&player.y<p.y+p.h&&player.y+player.h>p.y){
      if(player.vy>0&&player.y+player.h-player.vy<=p.y+5){player.y=p.y-player.h;player.vy=0;player.on=true}
    }
  }
  if(player.y>520){tries++;document.getElementById('tr').textContent=tries;player.x=30;player.y=380;player.vy=0}
  const last=plats[plats.length-1];
  if(player.x>last.x&&player.y<last.y+35){
    done=true;
    document.getElementById('wt').textContent=lv>=100?'Все 100 уровней пройдены!':'Уровень '+lv+' пройден!';
    document.getElementById('win').classList.add('show');
  }
  if(player.x<0)player.x=0;if(player.x>876)player.x=876;
}
function draw(){
  ctx.clearRect(0,0,900,480);
  ctx.fillStyle='rgba(255,255,255,.18)';
  ctx.beginPath();ctx.arc(120,70,40,0,Math.PI*2);ctx.arc(160,70,50,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(650,100,45,0,Math.PI*2);ctx.arc(700,100,55,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#a0e7e5';
  for(const p of plats){ctx.fillRect(p.x,p.y,p.w,p.h);ctx.strokeStyle='#fff';ctx.strokeRect(p.x,p.y,p.w,p.h)}
  const f=plats[plats.length-1];
  ctx.fillStyle='#ff0';ctx.fillRect(f.x+f.w/2-3,f.y-34,7,34);
  ctx.beginPath();ctx.moveTo(f.x+f.w/2+4,f.y-34);ctx.lineTo(f.x+f.w/2+24,f.y-22);ctx.lineTo(f.x+f.w/2+4,f.y-10);ctx.fill();
  ctx.fillStyle='#ff6b6b';ctx.fillRect(player.x,player.y,player.w,player.h);
  ctx.fillStyle='#fff';ctx.fillRect(player.x+4,player.y+5,6,6);ctx.fillRect(player.x+14,player.y+5,6,6);
}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body></html>
