<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky Obby — Кибер-склад</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { overflow: hidden; background: #0d0d12; }
    #gameCanvas { display: block; margin: 16px auto; background: linear-gradient(#1e3c72, #2a5298); border-radius: 16px; max-width: 100%; }
    .hud { text-align: center; padding: 10px; font-size: 1.1rem; color: #a0a0b0; }
  </style>
</head>
<body>
  <div class="game-header">
    <a href="../index.html" class="back-btn">← Назад</a>
    <div style="font-weight:700">🏗️ Sky Obby</div>
    <div style="width:90px"></div>
  </div>

  <div class="hud">Попытки: <span id="tries">0</span> &nbsp;•&nbsp; Дойди до флага!</div>
  <canvas id="gameCanvas" width="900" height="480"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let player = { x: 40, y: 380, w: 28, h: 36, vy: 0, onGround: false };
    let platforms = [
      {x:0,y:430,w:150,h:50}, {x:180,y:400,w:80,h:14}, {x:300,y:350,w:70,h:14},
      {x:400,y:300,w:60,h:14}, {x:500,y:260,w:70,h:14}, {x:600,y:210,w:60,h:14},
      {x:700,y:160,w:80,h:14}, {x:820,y:120,w:80,h:18}
    ];
    let tries = 0, keys = {}, won = false;

    document.addEventListener('keydown', e => keys[e.code] = true);
    document.addEventListener('keyup', e => keys[e.code] = false);

    function update() {
      if (won) return;
      if (keys['ArrowLeft'] || keys['KeyA']) player.x -= 5;
      if (keys['ArrowRight'] || keys['KeyD']) player.x += 5;
      if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.onGround) {
        player.vy = -13; player.onGround = false;
      }
      player.vy += 0.65; player.y += player.vy;
      player.onGround = false;

      for (let p of platforms) {
        if (player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y < p.y + p.h && player.y + player.h > p.y) {
          if (player.vy > 0 && player.y + player.h - player.vy <= p.y + 8) {
            player.y = p.y - player.h; player.vy = 0; player.onGround = true;
          }
        }
      }

      if (player.y > 500) {
        tries++; document.getElementById('tries').textContent = tries;
        player.x = 40; player.y = 380; player.vy = 0;
      }
      if (player.x > 830 && player.y < 160) {
        won = true;
        setTimeout(() => alert('🎉 Победа! Ты прошёл Sky Obby!'), 100);
      }
      if (player.x < 0) player.x = 0;
      if (player.x > 872) player.x = 872;
    }

    function draw() {
      ctx.clearRect(0, 0, 900, 480);
      // clouds
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.beginPath(); ctx.arc(100,70,40,0,Math.PI*2); ctx.arc(140,70,50,0,Math.PI*2); ctx.arc(180,70,35,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(600,100,45,0,Math.PI*2); ctx.arc(650,100,55,0,Math.PI*2); ctx.fill();

      ctx.fillStyle = '#a0e7e5';
      for (let p of platforms) {
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeStyle = '#fff'; ctx.strokeRect(p.x, p.y, p.w, p.h);
      }

      // flag
      ctx.fillStyle = '#ff0'; ctx.fillRect(840, 80, 12, 40);
      ctx.beginPath(); ctx.moveTo(852,80); ctx.lineTo(890,100); ctx.lineTo(852,120); ctx.fill();

      // player
      ctx.fillStyle = '#ff6b6b'; ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillStyle = '#fff'; ctx.fillRect(player.x+5, player.y+6, 7, 7); ctx.fillRect(player.x+16, player.y+6, 7, 7);
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
