<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#neon)" stroke-width="6" filter="url(#glow)" opacity="0.9"/>
  <!-- Inner cube isometric -->
  <g filter="url(#glow)" transform="translate(100,100)">
    <path d="M-40,-25 L0,-50 L40,-25 L0,0 Z" fill="#0a1628" stroke="url(#neon)" stroke-width="3"/>
    <path d="M-40,-25 L-40,25 L0,50 L0,0 Z" fill="#061018" stroke="url(#neon)" stroke-width="3"/>
    <path d="M40,-25 L40,25 L0,50 L0,0 Z" fill="#0d1f35" stroke="url(#neon)" stroke-width="3"/>
    <path d="M-40,-25 L0,-50 L40,-25 L0,0 Z" fill="url(#neon)" opacity="0.25"/>
  </g>
  <!-- Center core -->
  <circle cx="100" cy="100" r="12" fill="url(#neon)" filter="url(#glow)"/>
</svg>
