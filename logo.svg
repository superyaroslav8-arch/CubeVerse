<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6fb"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Cube -->
  <g filter="url(#glow)">
    <!-- Back face -->
    <path d="M50 70 L100 40 L150 70 L100 100 Z" fill="#1a1a4e" stroke="url(#g)" stroke-width="3"/>
    <!-- Left face -->
    <path d="M50 70 L50 130 L100 160 L100 100 Z" fill="#0d1b3d" stroke="url(#g)" stroke-width="3"/>
    <!-- Right face -->
    <path d="M150 70 L150 130 L100 160 L100 100 Z" fill="#152a5c" stroke="url(#g)" stroke-width="3"/>
    <!-- Top highlight -->
    <path d="M50 70 L100 40 L150 70 L100 100 Z" fill="url(#g)" opacity="0.3"/>
  </g>
  <!-- Stars / particles -->
  <circle cx="40" cy="50" r="3" fill="#00f2fe" opacity="0.8"/>
  <circle cx="160" cy="45" r="2.5" fill="#4facfe" opacity="0.9"/>
  <circle cx="30" cy="140" r="2" fill="#00c6fb"/>
  <circle cx="170" cy="150" r="3" fill="#00f2fe" opacity="0.7"/>
</svg>
