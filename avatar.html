<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аватар — Нексус</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="logo.svg" alt="Нексус">
      <h1>Нексус</h1>
    </div>
    <nav class="nav-menu">
      <a href="index.html" class="nav-item"><span class="icon">🏠</span><span>Главная</span></a>
      <a href="create.html" class="nav-item"><span class="icon">🛠️</span><span>Создать</span></a>
      <a href="mygames.html" class="nav-item"><span class="icon">📦</span><span>Мои игры</span></a>
      <a href="avatar.html" class="nav-item active"><span class="icon">👤</span><span>Аватар</span></a>
      <a href="friends.html" class="nav-item"><span class="icon">👥</span><span>Друзья</span></a>
      <a href="settings.html" class="nav-item"><span class="icon">⚙️</span><span>Настройки</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" id="userAvatarIcon">😎</div>
        <div class="user-info">
          <div style="font-weight:600;font-size:0.9rem" id="userName">Игрок</div>
          <div style="font-size:0.75rem;color:#888">Онлайн</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="font-size:1.2rem;font-weight:700">👤 Редактор аватара</div>
      <div class="topbar-actions">
        <button class="btn btn-primary" onclick="saveAvatar()">Сохранить</button>
      </div>
    </div>

    <div class="content">
      <div class="avatar-studio">
        <div class="avatar-preview">
          <div id="previewEmoji" style="font-size:7rem">😎</div>
          <div id="previewName" style="margin-top:16px;font-size:1.3rem;font-weight:700">Игрок</div>
        </div>

        <div class="avatar-options">
          <div class="option-group">
            <h3>Имя</h3>
            <input type="text" id="nameInput" maxlength="20" placeholder="Твоё имя" style="width:100%;padding:12px;background:var(--bg3);border:1px solid #333;border-radius:8px;color:white;font-size:1rem">
          </div>

          <div class="option-group">
            <h3>Выбери аватар</h3>
            <div class="item-options" id="emojiOptions"></div>
          </div>

          <div class="option-group">
            <h3>Цвет фона</h3>
            <div class="color-options" id="bgColors"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const emojis = ['😎','😀','🤖','👻','🐱','🐶','🦊','🐼','🦁','🐸','🦄','🐲','👽','🦸','🧙','🥷','👨‍🚀','🧛','🧟','🧑‍🎤'];
    const colors = ['#1a1a2e','#16213e','#0f3460','#533483','#e94560','#0f0c29','#1b262c','#0a3d62','#1e3799','#3c1053'];

    let currentEmoji = localStorage.getItem('nexus_avatar') || '😎';
    let currentName = localStorage.getItem('nexus_username') || 'Игрок';

    document.addEventListener('DOMContentLoaded', () => {
      loadUser();
      document.getElementById('nameInput').value = currentName;
      document.getElementById('previewEmoji').textContent = currentEmoji;
      document.getElementById('previewName').textContent = currentName;

      const emojiBox = document.getElementById('emojiOptions');
      emojis.forEach(e => {
        const btn = document.createElement('div');
        btn.className = 'item-btn' + (e === currentEmoji ? ' selected' : '');
        btn.textContent = e;
        btn.onclick = () => {
          document.querySelectorAll('#emojiOptions .item-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          currentEmoji = e;
          document.getElementById('previewEmoji').textContent = e;
        };
        emojiBox.appendChild(btn);
      });

      const colorBox = document.getElementById('bgColors');
      colors.forEach(c => {
        const btn = document.createElement('div');
        btn.className = 'color-btn';
        btn.style.background = c;
        btn.onclick = () => {
          document.querySelector('.avatar-preview').style.background = c;
        };
        colorBox.appendChild(btn);
      });

      document.getElementById('nameInput').addEventListener('input', e => {
        currentName = e.target.value || 'Игрок';
        document.getElementById('previewName').textContent = currentName;
      });
    });

    function saveAvatar() {
      saveUser(currentName, currentEmoji);
      alert('Аватар сохранён!');
      loadUser();
    }
  </script>
</body>
</html>
